name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kanakkupro
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kanakkupro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanakkupro
      SECRET_KEY: ci-only-secret-for-tests
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: python -m pip install -r requirements.lock
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - name: Financial dump and restore reconciliation
        env:
          RUN_FINANCIAL_RESTORE: "1"
          RESTORE_PG_BIN: /usr/lib/postgresql/16/bin
          RESTORE_AGE_BIN: /usr/bin/age
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client-16 age
          pytest apps/health/test_financial_restore.py -q
      - name: Production deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ
          ALLOWED_HOSTS: ci.example.test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanakkupro?sslmode=require
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.example.test
          DEFAULT_FROM_EMAIL: no-reply@example.test
          MFA_ENCRYPTION_KEYS: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          SECURE_HSTS_SECONDS: "3600"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Python dependency audit
        run: |
          python -m pip install --target "$RUNNER_TEMP/pip-audit" pip-audit==2.10.1
          PYTHONPATH="$RUNNER_TEMP/pip-audit" python -m pip_audit -r requirements.lock --no-deps --disable-pip --strict --progress-spinner off
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build

  native-build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: bash scripts/render_build.sh
      - name: Verify WSGI startup and collected assets
        run: |
          DJANGO_SETTINGS_MODULE=config.settings.build python -m gunicorn config.wsgi:application --config gunicorn.conf.py &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:10000/health/live/; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:10000/health/live/
          curl --fail --silent http://localhost:10000/static/css/app.css > /dev/null

  pilot-review:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_pilot_review_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_pilot_review_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_pilot_review_ci
      DJANGO_SETTINGS_MODULE: config.settings.review
      APP_ENV: test
      PILOT_REVIEW_PASSWORD: Temporary-CI-Review-Only-68!
      PILOT_REVIEW_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install application and browser tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          python -m pip install -r requirements.lock
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Prepare isolated synthetic review data
        run: python -m scripts.pilot_review --invoices 100
      - name: Verify HTTP workload and desktop/mobile browser journeys
        run: |
          mkdir -p phase6-artifacts
          python -m gunicorn config.wsgi:application --bind 127.0.0.1:8765 --workers 1 > phase6-artifacts/review-server.log 2>&1 &
          review_pid=$!
          trap 'kill "$review_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health/ready/; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/health/ready/
          python -m scripts.benchmark_pilot --base-url "$PILOT_REVIEW_URL" --include-pdf --output phase6-artifacts/benchmark.json
          npm run test:browser
      - name: Preserve synthetic review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-pilot-review
          path: |
            phase6-artifacts/
            test-results/
          retention-days: 7
