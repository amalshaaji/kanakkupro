{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"allowScriptTags":false}'>
    <title>{% block title %}KankkuPro{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  </head>
  <body class="min-h-screen bg-base-200 text-base-content">
    {% include "partials/site_header.html" %}
    <main id="main-content" class="mx-auto w-full max-w-6xl px-5 py-12 md:px-10">
      {% if messages %}
        <div class="mb-6 space-y-2" aria-live="polite">
          {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-info{% endif %}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <script>
      document.body.addEventListener("htmx:configRequest", (event) => {
        const token = document.querySelector("[name=csrfmiddlewaretoken]")?.value;
        if (token) event.detail.headers["X-CSRFToken"] = token;
      });
    </script>
  </body>
</html>
