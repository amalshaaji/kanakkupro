<nav aria-label="Workspace" class="workspace-navigation flex flex-col gap-1">

  <div class="workspace-label nav-section-label">SALES</div>
  <a class="btn btn-ghost justify-start {% if request.resolver_match.app_name == 'customers' %}menu-active{% endif %}" href="{% url 'customers:list' %}" {% if request.resolver_match.app_name == 'customers' %}aria-current="page"{% endif %}>

    <svg aria-hidden="true" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-5 5"/></svg> Reports
