<fieldset class="card min-w-0 border border-base-300 bg-base-100"><legend class="px-4 pt-4 text-sm font-semibold">Line item</legend><div class="card-body grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
  {% if line_form.non_field_errors %}<div class="alert alert-error sm:col-span-2 lg:col-span-3" role="alert">{{ line_form.non_field_errors }}</div>{% endif %}
  {% for field in line_form %}<div class="min-w-0">{% include "partials/form_field.html" with field=field %}</div>{% endfor %}
</div></fieldset>
